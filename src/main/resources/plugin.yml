name: Stash
version: '${project.version}'
main: com.kartersanamo.stash.Stash
api-version: '1.21'
authors: [KarterSanamo]

commands:
  pv:
    description: Open personal vaults
    usage: /pv [page|list|search|admin ...]
    aliases: [vault]
  stash:
    description: Stash plugin command
    usage: /stash <reload|backup|backups|restore>

permissions:
  stash.use:
    default: true
  stash.command:
    default: true
  stash.reload:
    default: op
  stash.admin:
    default: op
  stash.admin.inspect:
    default: op
  stash.admin.restore:
    default: op
  stash.admin.audit:
    default: op
  stash.pages.*:
    default: false
  stash.size.*:
    default: false
